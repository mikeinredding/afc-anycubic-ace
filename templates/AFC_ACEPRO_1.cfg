#--=================================================================================--#
######### Anycubic ACE Pro (first generation) ###########################################
#--=================================================================================--#
# IN TESTING. Read docs/ACEPRO.md and follow its staged test plan before printing.
#
# One ACE Pro, four slots (1-4 left to right) mapped to lane1-lane4, feeding one
# toolhead through a 4-in-1 splitter. Written for a K1 Max with the Creality
# K1-series CFS upgrade kit used as the extruder + cutter (NOT the CFS box),
# running Simple AF. Use the kit's non-CFS toolhead firmware.

[AFC_ACEPRO ACE_1]
# The ACE is a USB serial device. Use the by-id path (ls /dev/serial/by-id/):
# it survives the ACE re-enumerating, which it does on its own after a USB
# reset, while /dev/ttyACM0 may come back as ttyACM1.
serial: /dev/serial/by-id/usb-ANYCUBIC_ACE_1-if00
hub: ACE_1                       # the splitter; see [AFC_hub ACE_1] below
extruder: extruder

# ACE outlet to the toolhead sensor (mm). Measure it with
#   AFC_ACEPRO_CALIBRATE LANE=lane1
# and put the result here. A lane whose tube is a different length can set its
# own bowden_length in its [AFC_ACEPRO_lane] section.
bowden_length: 1000

#feed_speed: 80                  # mm/s, fast part of a load (ACE max 100)
#retract_speed: 80               # mm/s, unload unwind
#approach_length: 150            # the last mm before the sensor run slowly...
#approach_speed: 20              # ...at this speed, so the tip meets the toolhead gently
#approach_extra: 100             # how far past bowden_length the approach may go
#load_attempts: 2
#retreat_margin: 30             # a failed load is pulled back this far past the splitter
                                 # sensor (or by the fed distance without one)

# Hand-off into the extruder gears. On the CFS kit toolhead the filament
# sensor is above the gears: the ACE pushes grab_length more while the
# extruder turns the same distance, then feed assist takes over.
#grab_length: 20
#grab_speed: 8                   # mm/s, both the ACE and the extruder
#feed_assist: True               # the ACE feeds along with the extruder while printing

# Unload: after the cut, pull out of the gears, then the ACE unwinds
# bowden_length + unload_extra and leaves the tip staged at its outlet.
#unload_retract_steps: 10:600, 10:1800   # mm:mm/min. K1 Max kit: 10 mm cutter -> gears
#unload_extra: 0                 # more unwinding; too much pulls the tip past the slot
                                 # sensor and the slot then reads empty
#eject_length: 100               # AFC_ACEPRO_EJECT / AFC's eject: unwind this much

# The cutter switch on the CFS kit toolhead. When set, loads refuse to start
# with the blade down and every cut is verified (the K1 Max switch fires near
# the end of the blade's travel). Check the polarity with AFC_ACEPRO_STATUS.
#cutter_sensor_pin: nozzle_mcu:PA8
#cutter_require_trigger: True

# The ACE reads Anycubic RFID tags itself; their color and material go onto
# the lane when a spool is inserted (not if the lane has a Spoolman spool).
#rfid_apply: True

#max_dryer_temperature: 55       # AFC_ACEPRO_DRY never heats above this; 0 disables it

#poll_interval: 1.0              # status poll; also the ACE's keepalive (it resets
                                 # its USB link after ~3 s without a frame). Max 2.
#request_timeout: 1.5
#boot_wait: 15                   # PREP waits this long for an ACE that is still starting

# Trace recording: ACE traffic + load/unload/cut events with timings, as JSON
# lines. On while this is in testing; download it from Mainsail/Fluidd's Logs.
trace_file: /usr/data/printer_data/logs/acepro_trace.jsonl   # ~/printer_data/logs/... on a Pi
#trace_max_size: 5               # MB before rotating
#trace_polls: False              # also record the 1 s status polls (much bigger file)

[AFC_hub ACE_1]
# Where the four tubes merge. With no sensor there, leave it virtual.
switch_pin: virtual
# Or use the K1 Max's stock rear runout sensor on the shared tube after the
# splitter (comment out the stock [filament_switch_sensor filament_sensor] that
# uses PC15 first). Loads then refuse to start while it sees filament, and an
# unload must clear it.
#switch_pin: !PC15
afc_bowden_length: 0

[AFC_ACEPRO_lane lane1]
unit: ACE_1:1
#map: T0
[AFC_ACEPRO_lane lane2]
unit: ACE_1:2
#map: T1
[AFC_ACEPRO_lane lane3]
unit: ACE_1:3
#map: T2
[AFC_ACEPRO_lane lane4]
unit: ACE_1:4
#map: T3

# The toolhead side lives in AFC_Hardware.cfg (created by AFC's installer), NOT
# here: [include AFC/*.cfg] loads files alphabetically, so an [AFC_extruder
# extruder] section in this file would be overridden by AFC_Hardware.cfg. Set
# these in AFC_Hardware.cfg's [AFC_extruder extruder]:
#
#   pin_tool_start: ^!nozzle_mcu:PA10   # the CFS kit's filament sensor above the gears
#       Simple AF removes [filament_switch_sensor filament_sensor_2] from
#       printer.cfg; don't keep any filament_switch_sensor on that pin.
#   tool_stn: 60                        # sensor-to-nozzle; the load pushes grab_length
#                                       # of it during the hand-off, the rest after
#   tool_stn_unload: 0                  # unload uses unload_retract_steps instead
#   tool_load_speed: 10
#
# The AFC.cfg / AFC_Macro_Vars.cfg edits (cutter position, purge, park) are the
# same as for a CFS kit toolhead: see docs/ACEPRO.md, "Lines to change in AFC's
# own files". park_cmd should be AFC_ACEPRO_PARK (below).

# Park over the kit's purge chute without ever going below a safe Z.
# AFC_PARK can only raise Z relative to the current height, so a load near the
# bed would reach the chute at Z ~0-2, where the purge mechanism hits the bed.
# This raises Z to at least min_z (never lowers it), then travels sideways in
# front of safe_y (the back strip holds the cutter lever and the wiper) and
# goes straight back. K1 Max values, measured with the CFS kit.
[gcode_macro AFC_ACEPRO_PARK]
description: Park over the purge chute at a safe height
variable_park_x: 185.0
variable_park_y: 305.5
variable_min_z: 30.0
variable_safe_y: 291.5
variable_travel_speed: 250       # mm/s
variable_z_speed: 15             # mm/s
gcode:
  {% set cur_z = printer.gcode_move.gcode_position.z|float %}
  {% set cur_x = printer.gcode_move.gcode_position.x|float %}
  {% set cur_y = printer.gcode_move.gcode_position.y|float %}
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set safe_z = [[cur_z, min_z]|max, max_z]|min %}
  {% set f_xy = travel_speed * 60 %}
  G90
  {% if safe_z > cur_z %}
    G1 Z{safe_z} F{z_speed * 60}
  {% endif %}
  {% if (cur_x - park_x)|abs > 0.1 %}
    {% if cur_y > safe_y %}
      G1 Y{safe_y} F{f_xy}
    {% endif %}
    G1 X{park_x} F{f_xy}
  {% endif %}
  G1 Y{park_y} F{f_xy}
  M400

# Leave the purge chute before AFC puts the toolhead back. After a load AFC
# restores Z first; with the toolhead still over the chute the bed would rise
# into the purge hopper. Run from AFC's post_load_macro / post_unload_macro.
[gcode_macro AFC_ACEPRO_LEAVE_PURGE]
description: Move forward out of the purge chute area
variable_settle_ms: 1000         # time for the purge hopper to spring back
gcode:
  {% set park = printer["gcode_macro AFC_ACEPRO_PARK"] %}
  {% if "y" in printer.toolhead.homed_axes %}
    {% if printer.toolhead.position.y|float > park.safe_y|float %}
      SAVE_GCODE_STATE NAME=_afc_ace_leave
      G90
      G1 Y{park.safe_y} F{park.travel_speed * 60}
      M400
      G4 P{settle_ms}
      RESTORE_GCODE_STATE NAME=_afc_ace_leave
    {% endif %}
  {% endif %}
